<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبتي الصغيرة</title>
<style>
:root{--bg:#F5F8FA;--card:#fff;--ink:#17252A;--mute:#5B6B72;--teal:#0F4C5C;--sun:#F2B134;--cta:#D8432B;--line:#DDE5E9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1E;--card:#18262C;--ink:#EAF1F3;--mute:#9DB0B7;--teal:#7CC4D4;--line:#2A3B43}}
:root[data-theme="dark"]{--bg:#0F1A1E;--card:#18262C;--ink:#EAF1F3;--mute:#9DB0B7;--teal:#7CC4D4;--line:#2A3B43}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
header{background:#0F4C5C;color:#fff;padding:28px 18px 24px}
header h1{margin:0 0 6px;font-size:1.7rem;font-weight:800}
header p{margin:0;max-width:34em;opacity:.9}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin:18px 0;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px 16px;border-radius:20px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
:root[data-theme="dark"] .tabs button[aria-pressed="true"]{color:#0F1A1E}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:110px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800;font-size:1.05rem;color:#fff}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:.95rem}
.info small{color:var(--mute)}
.price{font-weight:800}
.add{margin-top:auto;border:0;background:var(--cta);color:#fff;font:inherit;font-weight:600;padding:7px;border-radius:8px;cursor:pointer}
.bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bar button{border:0;background:var(--teal);color:#fff;font:inherit;font-weight:600;padding:9px 20px;border-radius:8px;cursor:pointer}
:root[data-theme="dark"] .bar button{color:#0F1A1E}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 10px;font-size:1.2rem}
.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.qty span{display:inline-block;min-width:24px;text-align:center}
label{display:block;margin-top:10px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:800;margin:12px 0}
.send{display:block;text-align:center;text-decoration:none;background:#1FA855;color:#fff;font-weight:800;padding:11px;border-radius:8px}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.note{color:var(--mute);font-size:.85rem;margin-top:8px}
.close{float:left;border:0;background:none;color:var(--mute);font-size:1.4rem;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="sname"></h1><p>كتب أطفال وكراسات تنظيم وقت للطلاب. اطلب من هنا، ونتواصل معك على واتساب لتأكيد الطلب والشحن داخل مصر.</p></div></header>
<main class="wrap">
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
</main>
<div class="bar"><div><b id="cnt">0</b> منتج · <b id="sum">0</b> ج.م</div><button id="open">عرض السلة</button></div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="السلة">
<div class="panel">
<button class="close" id="close" aria-label="إغلاق">×</button>
<h2>سلة الطلب</h2>
<div id="lines"></div>
<div class="total"><span>المجموع (بدون الشحن)</span><span><span id="tot">0</span> ج.م</span></div>
<label>الاسم<input id="f_name" autocomplete="name"></label>
<label>رقم الموبايل<input id="f_phone" inputmode="tel" autocomplete="tel"></label>
<label>المحافظة<input id="f_gov"></label>
<label>العنوان بالتفصيل<textarea id="f_addr" rows="2"></textarea></label>
<label>طريقة الدفع<select id="f_pay"><option>الدفع عند الاستلام</option><option>إنستاباي</option><option>فودافون كاش</option></select></label>
<p class="note" id="ship"></p>
<a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">أرسل الطلب عبر واتساب</a>
</div>
</div>

<script>
/* ===== عدّل هذا القسم فقط ===== */
var STORE_NAME = "مكتبتي الصغيرة";
var WHATSAPP = "201000000000";          // رقمك بصيغة دولية بدون + أو أصفار (مصر: 20 ثم الرقم بدون 0)
var SHIPPING_NOTE = "تكلفة الشحن تُحدد حسب محافظتك وتُؤكد معك على واتساب.";
var CATS = ["الكل", "كتب أطفال", "كراسات الطلاب"];
var PRODUCTS = [
  {id:1, name:"عنوان كتاب الأطفال الأول", cat:"كتب أطفال", price:120, age:"٤ - ٨ سنوات", color:"#0F4C5C"},
  {id:2, name:"عنوان كتاب الأطفال الثاني", cat:"كتب أطفال", price:100, age:"٥ - ٩ سنوات", color:"#B5651D"},
  {id:3, name:"عنوان كتاب الأطفال الثالث", cat:"كتب أطفال", price:90, age:"٣ - ٦ سنوات", color:"#6B4E9B"},
  {id:4, name:"كراسة تنظيم الوقت للطلاب", cat:"كراسات الطلاب", price:80, age:"إعدادي وثانوي", color:"#C0392B"},
  {id:5, name:"كراسة التعامل مع ضغط المذاكرة", cat:"كراسات الطلاب", price:85, age:"إعدادي وثانوي", color:"#1F7A5A"},
  {id:6, name:"مخطط الأسبوع الدراسي", cat:"كراسات الطلاب", price:60, age:"كل المراحل", color:"#2C5AA0"}
];
/* ============================== */
var cart = {}, cat = "الكل";
var $ = function(id){return document.getElementById(id)};
$("sname").textContent = STORE_NAME; document.title = STORE_NAME;
$("ship").textContent = SHIPPING_NOTE;
try { var s = localStorage.getItem("cart"); if (s) cart = JSON.parse(s) || {}; } catch(e) {}

function save(){ try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e) {} }
function find(id){ return PRODUCTS.filter(function(p){return p.id==id})[0]; }
function totals(){ var n=0,t=0; for (var id in cart){ var p=find(id); if(p){n+=cart[id]; t+=cart[id]*p.price;} } return {n:n,t:t}; }

function drawTabs(){
  var box=$("tabs"); box.innerHTML="";
  CATS.forEach(function(c){
    var b=document.createElement("button"); b.textContent=c; b.setAttribute("aria-pressed", c===cat);
    b.onclick=function(){cat=c; drawTabs(); drawGrid();}; box.appendChild(b);
  });
}
function drawGrid(){
  var g=$("grid"); g.innerHTML="";
  PRODUCTS.filter(function(p){return cat==="الكل"||p.cat===cat}).forEach(function(p){
    var d=document.createElement("div"); d.className="item";
    var c=document.createElement("div"); c.className="cover"; c.style.background=p.color; c.textContent=p.name;
    var i=document.createElement("div"); i.className="info";
    var h=document.createElement("h3"); h.textContent=p.name;
    var a=document.createElement("small"); a.textContent=p.age;
    var pr=document.createElement("div"); pr.className="price"; pr.textContent=p.price+" ج.م";
    var b=document.createElement("button"); b.className="add"; b.textContent="أضف للسلة";
    b.onclick=function(){cart[p.id]=(cart[p.id]||0)+1; refresh();};
    i.append(h,a,pr,b); d.append(c,i); g.appendChild(d);
  });
}
function drawLines(){
  var box=$("lines"); box.innerHTML="";
  var ids=Object.keys(cart).filter(function(id){return cart[id]>0&&find(id)});
  if(!ids.length){ box.textContent="السلة فارغة. اختر منتجًا من القائمة."; return; }
  ids.forEach(function(id){
    var p=find(id), l=document.createElement("div"); l.className="line";
    var n=document.createElement("span"); n.textContent=p.name;
    var q=document.createElement("span"); q.className="qty";
    var m=document.createElement("button"); m.textContent="−"; m.setAttribute("aria-label","إنقاص");
    var v=document.createElement("span"); v.textContent=cart[id];
    var a=document.createElement("button"); a.textContent="+"; a.setAttribute("aria-label","زيادة");
    m.onclick=function(){cart[id]--; if(cart[id]<=0) delete cart[id]; refresh();};
    a.onclick=function(){cart[id]++; refresh();};
    q.append(m,v,a); l.append(n,q); box.appendChild(l);
  });
}
function message(){
  var t=totals(), L=["طلب جديد من "+STORE_NAME,""];
  for (var id in cart){ var p=find(id); if(p) L.push("• "+p.name+" × "+cart[id]+" = "+(p.price*cart[id])+" ج.م"); }
  L.push("","المجموع: "+t.t+" ج.م (بدون الشحن)","الاسم: "+$("f_name").value,"الموبايل: "+$("f_phone").value,
    "المحافظة: "+$("f_gov").value,"العنوان: "+$("f_addr").value,"الدفع: "+$("f_pay").value);
  return L.join("\n");
}
function updateSend(){
  var t=totals(), ok=t.n>0 && $("f_name").value.trim() && $("f_phone").value.trim() && $("f_gov").value.trim() && $("f_addr").value.trim();
  var a=$("send"); a.setAttribute("aria-disabled", ok?"false":"true");
  a.href = ok ? "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(message()) : "#";
}
function refresh(){
  var t=totals(); $("cnt").textContent=t.n; $("sum").textContent=t.t; $("tot").textContent=t.t;
  drawLines(); updateSend(); save();
}
["f_name","f_phone","f_gov","f_addr","f_pay"].forEach(function(id){ $(id).addEventListener("input",updateSend); });
$("open").onclick=function(){ $("sheet").classList.add("open"); };
$("close").onclick=function(){ $("sheet").classList.remove("open"); };
$("sheet").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
drawTabs(); drawGrid(); refresh();
</script>
</body>
</html>
